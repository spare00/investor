name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Typecheck (strict allowlist)
        # Grow this list as modules are made strict-clean. Do not `mypy app`.
        run: mypy --strict app/core/logging.py app/execution/sizing.py
      - name: Unit tests
        run: pytest tests/unit -q
        env:
          APP_ENV: test
          TRADING_MODE: paper
          LIVE_TRADING_ENABLED: "false"
          ENABLE_BROKER_ORDERS: "false"
          ENABLE_AUTOMATED_EXECUTION: "false"
          ENABLE_EXTERNAL_DATA: "false"
          ENABLE_MARKET_DATA_COLLECTION: "false"
