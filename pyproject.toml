[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "investor"
version = "0.1.0"
description = "Six-agent AI investment firm for US equities (paper trading first)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Investor Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "apscheduler>=3.10.4",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "python-dotenv>=1.0.1",
    "exchange-calendars>=4.5.5",
    "pandas>=2.2.3",
    "numpy>=2.1.0",
    "tenacity>=9.0.0",
    "ib_async>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
]
yfinance = [
    "yfinance>=0.2.48",
]
ibkr = [
    "ib_async>=2.0.0",
]

[project.scripts]
investor = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
